[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toyworld"
version = "0.0.1"
description = "Toy world demo harness (T3): replay a tiny road network's AI driver decisions through the Gradebook library into SigNoz. Deterministic, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# gradebook is THIS repo's reference library (../reference-library), NOT the
# unrelated PyPI project that owns the name. It must therefore be installed in
# the same pip invocation - every documented command does
# `pip install -e reference-library -e toy-world[...]`, which resolves the
# requirement below against the local editable and never reaches PyPI.
# Installing toy-world alone silently pulls the stranger's package; tests/
# conftest.py fails loud with that diagnosis rather than an opaque ImportError
# (ticket #30). A path-pinned direct reference was tried and rejected: it makes
# pip refuse the `-e reference-library -e toy-world` form the judge runbook
# (docs/judge-run.md) uses.
dependencies = [
  "gradebook",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# Live mode (ticket #9): real model calls via OpenRouter (OpenAI-compatible,
# the default) or, temporarily while OpenRouter credits are provisioned,
# directly via the native Anthropic SDK and Gemini's OpenAI-compatible
# endpoint (toyworld.direct). Replay mode needs none of this - judges run
# replay with no key installed.
live = [
  "openai>=1.0",
  "anthropic>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toyworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
